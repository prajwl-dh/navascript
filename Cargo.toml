[workspace]
resolver = "2"
members = [
    "compiler/ast",
    "compiler/diagnostics",
    "compiler/lexer",
    "compiler/parser",
    "compiler/symbol",
    "compiler/semantic",
    "compiler/typechecker",
    "compiler/ir",
    "compiler/optimizer",
    "compiler/codegen",
    "compiler/driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Prajwal Dhungana <dhunganaprajwal1@gmail.com>"]
license = "MIT OR Apache-2.0"
