[package]
name = "nava"
description = "Nava compiler driver and command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "nava_driver"
path = "src/lib.rs"

[[bin]]
name = "nava"
path = "src/main.rs"

[dependencies]
nava-parser = { path = "../parser" }
nava-typechecker = { path = "../typechecker" }

# Cross-crate integration tests live in the repository's top-level tests/ tree.
[[test]]
name = "parser_pipeline"
path = "../../tests/parser/pipeline.rs"

[[test]]
name = "typechecker_pipeline"
path = "../../tests/typechecker/pipeline.rs"
