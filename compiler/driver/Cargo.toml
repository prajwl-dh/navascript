[package]
name = "nava"
description = "Nava compiler driver and command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "nava_driver"
path = "src/lib.rs"

[[bin]]
name = "nava"
path = "src/main.rs"

[dependencies]
nava-codegen = { path = "../codegen" }
nava-ir = { path = "../ir" }
nava-parser = { path = "../parser" }
nava-typechecker = { path = "../typechecker" }

# All tests live in the repository's top-level tests/ tree. They are registered
# explicitly because Cargo only auto-discovers tests/ inside a package root.
[dev-dependencies]
nava-ast = { path = "../ast" }
nava-codegen = { path = "../codegen" }
nava-diagnostics = { path = "../diagnostics" }
nava-ir = { path = "../ir" }
nava-lexer = { path = "../lexer" }
nava-symbol = { path = "../symbol" }

[[test]]
name = "ast_span"
path = "../../tests/ast/span.rs"

[[test]]
name = "diagnostics"
path = "../../tests/diagnostics/diagnostics.rs"

[[test]]
name = "lexer"
path = "../../tests/lexer/lexer.rs"

[[test]]
name = "parser"
path = "../../tests/parser/parser.rs"

[[test]]
name = "parser_pipeline"
path = "../../tests/parser/pipeline.rs"

[[test]]
name = "symbol"
path = "../../tests/symbol/symbol.rs"

[[test]]
name = "typechecker_types"
path = "../../tests/typechecker/types.rs"

[[test]]
name = "typechecker_checker"
path = "../../tests/typechecker/checker.rs"

[[test]]
name = "typechecker_pipeline"
path = "../../tests/typechecker/pipeline.rs"

[[test]]
name = "ir_lower"
path = "../../tests/ir/lower.rs"

[[test]]
name = "ir_verify"
path = "../../tests/ir/verify.rs"

[[test]]
name = "ir_print"
path = "../../tests/ir/print.rs"

[[test]]
name = "driver_cli"
path = "../../tests/driver/cli.rs"

[[test]]
name = "driver_binary"
path = "../../tests/driver/binary.rs"

[[test]]
name = "codegen"
path = "../../tests/codegen/codegen.rs"

[[test]]
name = "driver_native"
path = "../../tests/driver/native.rs"

[[test]]
name = "runtime_unit"
path = "../../tests/runtime/runtime.rs"
