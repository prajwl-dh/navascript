name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          brew install llvm
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Install TypeScript for the compatibility harness
        run: npm install --global typescript
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with no warnings allowed
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Run compatibility harness tests
        run: python3 -m unittest discover -s tests/compatibility -p 'test_*.py'
      - name: Check the committed compatibility report is reproducible
        run: |
          cargo build --workspace
          python3 scripts/compat.py --check
